<body>
    <h4>
        <center>
        FILL THIS FORM SO HTML GROOM CAN SEND YOU THE CASCADING STYLESHEET UPDATE DIRECTLY.

    <!-- optional form-->
    <form id="update">
        <div class="panel">
            <br><br>
            <label for="full name">NAMES :</label>
                <input type="text" placeholder="html groom" style="text-transform:uppercase" id="name"required >
                <br><br>
                <label for="e-mail">E-MAIL :</label>
                <input type="email" placeholder="htmlgroom123@gmail.com" style="text-transform:lowercase" id="email" required >
                <br><br>
                <label for="phone number ">PHONE NO :</label>
                <input type="tel" placeholder="+234*********" style="text-transform:uppercase" id="tel" required >
                <br><br>

                <br><br>

    </form>
   <script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

  const SUPABASE_URL = 'https://vgriftecqunhbyutashg.supabase.co'
  const SUPABASE_KEY = 'sb_publishable_bqcqtp_R5ltcbRFefOykAw_DplWSCk7'
  const supabase = createClient(SUPABASE_URL, SUPABASE_KEY)

  document.getElementById('update').addEventListener('submit', async (e) => {
    e.preventDefault()
    alert('Submitting...')

    // 1. Get form values
    const formData = {
      name: document.getElementById('name').value,
      email: document.getElementById('email').value,
      tel: document.getElementById('tel').value,
      choice: document.querySelector('input[name="choice"]:checked')?.value || null
    }

    // 2. Insert into Supabase table
    const { error } = await supabase.from('Registration form').insert([formData])

    // 3. Show result
    if (error) { 
      alert('Error: ' + error.message) 
    } else { 
      alert('Done! ✅ You will surely get updated') 
    }
  })
</script>

    <form id="upload">

   <script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

  const SUPABASE_URL = 'https://vgriftecqunhbyutashg.supabase.co'
  const SUPABASE_KEY = 'sb_publishable_bqcqtp_R5ltcbRFefOykAw_DplWSCk7'
  const supabase = createClient(SUPABASE_URL, SUPABASE_KEY)

  document.getElementById('upload').addEventListener('submit', async (e) => {
  e.preventDefault()
  alert('Submitting...')

  const file = document.getElementById('receipt_url').files[0]
  if(!file) {
    alert('Please upload proof of payment')
    return
  }

  // 1. Upload to RECEIPT bucket - ALL CAPS
  const fileName = Date.now() + '-' + file.name 
  const { data, error: uploadError } = await supabase.storage
 .from('RECEIPT') // <-- FIXED: was 'Receipt'
 .upload(fileName, file)

  if(uploadError) {
    alert('Upload error: ' + uploadError.message)
    return
  }
  
  // 2. Get public URL
  const { data: urlData } = supabase.storage.from('RECEIPT').getPublicUrl(fileName) // <-- FIXED
  const receiptUrl = urlData.publicUrl

  // 3. Get form values
  const formData = {
    full_name: document.getElementById('full_name').value,
    email: document.getElementById('e_mail').value,
    phone_number: document.getElementById('phone_no').value,
    receipt_url: receiptUrl
  }

  // 4. Insert into Supabase table
  const { error } = await supabase.from('Payment').insert([formData]) // <-- Change to 'Registration form' if that's your table

  // 5. Show result
  if (error) {
    alert('Error: ' + error.message)
  } else {
    alert('Your receipt upload is Successfully ✔️ . You will get feedback within 48 hours.')
    document.getElementById('upload').reset()
  }
})
