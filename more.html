<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>more</title>
    <link rel="stylesheet" href="Learn HTML.css">
<style>
         * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }
    </style>
</head>
<body>
    <h4>
        <center>
        FILL THIS FORM SO HTML GROOM CAN SEND YOU THE CASCADING STYLESHEET UPDATE DIRECTLY. 
        </center>
    </h4><hr>
    <!-- optional form-->
    <form id="update">
        <div class="form-card">
            <center>
                <h2>update form</h2>
            </center>
            <br><br>
            <div class="form-group">
            <label for="name">NAMES :</label>
               </br>
                <input type="text" placeholder="html groom" style="text-transform:uppercase" id="name"required >
                </div>
                <br><br>
                <div class="form-group">
                <label for="e-mail">E-MAIL :</label>
                </br>
                <input type="email" placeholder="htmlgroom123@gmail.com" style="text-transform:lowercase" id="email" required >
                </div>
                <br><br>
                <div class="form-group">
                <label for="phone number ">PHONE NO :</label>
                </br>
                <input type="tel" placeholder="+234*********" style="text-transform:uppercase" id="tel" required >
                </div>
                <br>
                <div class="radio-group">
                <label style="text-transform:lowercase ; ">DID YOU ENJOY LEARNING FROM </br>HTML GROOM? </label>
                <br>
                <div class="radio-option">
                <input type="radio" id="yes" name="choice" value="YES">
                <label for="yes">YES</label>
                &nbsp&nbsp
                <input type="radio" id="no" name="choice" value="NO">
                <label for="no">NO</label>
                </div>
                </div>
                <br>
                <div class="btn-group">
                <input type="submit" style="height:3em; width:16em; padding:1em 1em; color:White ; background-color:#007864; border-radius:8px;"><br><br>
                    <input type="reset" style="height:3em; width:8em; padding:1em 1em; color:White ; background-color:transparent ; border-radius:8px;">
                    </div>
                    </div>
                <br>
        </div>
    </form>
   <script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

  const SUPABASE_URL = 'https://vgriftecqunhbyutashg.supabase.co'
  const SUPABASE_KEY = 'sb_publishable_bqcqtp_R5ltcbRFefOykAw_DplWSCk7'
  const supabase = createClient(SUPABASE_URL, SUPABASE_KEY)

  document.getElementById('update').addEventListener('submit', async (e) => {
    e.preventDefault()
    alert('Submitting...')

    // 1. Get form values
    const formData = {
      name: document.getElementById('name').value,
      email: document.getElementById('email').value,
      tel: document.getElementById('tel').value,
      choice: document.querySelector('input[name="choice"]:checked')?.value || null
    }

    // 2. Insert into Supabase table
    const { error } = await supabase.from('Registration form').insert([formData])

    // 3. Show result
    if (error) { 
      alert('Error: ' + error.message) 
    } else { 
      alert('Done! ✅ You will surely get updated') 
    }
  })
</script>
    <script src="Learn HTML.js"></script>
</body>
</html>
