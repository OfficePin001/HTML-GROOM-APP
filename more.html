<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>more</title>
    <link rel="stylesheet" href="Learn HTML.css">
</head>
<body>
    <h4>
        <center>
        FILL THIS FORM SO HTML GROOM CAN SEND YOU THE CASCADING STYLESHEET UPDATE DIRECTLY. 
        </center>
    </h4><hr>
    <!-- optional form-->
    <form id="update">
        <div class="panel">
            <br><br>
            <label for="full name">NAMES :</label>
                <input type="text" placeholder="html groom" style="text-transform:uppercase" id="name"required >
                <br><br>
                <label for="e-mail">E-MAIL :</label>
                <input type="email" placeholder="htmlgroom123@gmail.com" style="text-transform:lowercase" id="email" required >
                <br><br>
                <label for="phone number ">PHONE NO :</label>
                <input type="tel" placeholder="+234*********" style="text-transform:uppercase" id="tel" required >
                <br><br>
                <label>DID YOU ENJOY LEARNING FROM HTML GROOM? </label>
                <br><br>
                <input type="radio" id="yes" name="choice">
                <label for="yes">YES</label>
                &nbsp&nbsp
                <input type="radio" id="no" name="choice">
                <label for="no">NO</label>
                <br><br><br><br>
                <input type="submit" style="height:3em; width:8em; padding:1em 1em; color:black; background-color:#007864 ; border-radius:8px;">&nbsp&nbsp
                    <input type="reset" style="height:3em; width:8em; padding:1em 1em; color:black; background-color:#007864; border-radius:8px;">
                <br><br>
        </div>
    </form>
   <script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

  const SUPABASE_URL = 'https://vgriftecqunhbyutashg.supabase.co'
  const SUPABASE_KEY = 'sb_publishable_bqcqtp_R5ltcbRFefOykAw_DplWSCk7'
  const supabase = createClient(SUPABASE_URL, SUPABASE_KEY)

  document.getElementById('update').addEventListener('submit', async (e) => {
    e.preventDefault()
    alert('Submitting...')

    // 1. Get form values
    const formData = {
      name: document.getElementById('name').value,
      email: document.getElementById('email').value,
      tel: document.getElementById('tel').value,
      choice: document.querySelector('input[name="choice"]:radio')?.value || null
    }

    // 2. Insert into Supabase table
    const { error } = await supabase.from('Registration form').insert([formData])

    // 3. Show result
    if (error) { 
      alert('Error: ' + error.message) 
    } else { 
      alert('Done! ✅ You will surely get updated') 
    }
  })
</script>
    <script src="Learn HTML.js"></script>
</body>
</html>
